<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f4f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Modather">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title># Modather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Dancing+Script:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;--bg:#f2f4f7;--ink:#1d2433;--muted:#5d6980;--line:#cfd6e0;--strong:#8b95a5;
  --accent:#2f6fe4;--accent-ink:#fff;--mark:#ffd966;--danger:#c62828;--panel:#dcdfe4;
  --hand:"Kalam","Comic Sans MS",cursive;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#171e2e;--bg:#0e131f;--ink:#edf1fb;--muted:#a1afc9;--line:#2f3b57;--strong:#55627f;--accent:#86a6ff;--accent-ink:#0b1226;--danger:#ff8a80;--panel:#252d42;color-scheme:dark}
}
:root[data-theme="dark"]{--paper:#171e2e;--bg:#0e131f;--ink:#edf1fb;--muted:#a1afc9;--line:#2f3b57;--strong:#55627f;--accent:#86a6ff;--accent-ink:#0b1226;--danger:#ff8a80;--panel:#252d42;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--fbody,"IBM Plex Sans",system-ui,sans-serif);line-height:1.5;background-color:var(--bg);background-color:color-mix(in srgb,var(--tint,transparent) var(--tintp,7%),var(--bg));background-repeat:repeat}
h1,h2,h3{font-family:var(--hand);margin:0;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:1060px;margin:0 auto;padding:16px 14px 80px}
a{color:var(--accent)}
.ar{font-family:var(--far,"Noto Naskh Arabic","Amiri",serif);direction:rtl;text-align:right;line-height:2}
.pastel{background:color-mix(in srgb,var(--c) 16%,var(--paper))}
.solid{background:var(--c);color:var(--on,#fff)}
.hand{font-family:var(--hand)}

/* top + tabs */
.top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.brand{font-family:var(--hand);font-weight:700;font-size:1.5rem;line-height:1.2}
.brand small{display:block;font-family:var(--fbody,"IBM Plex Sans");font-weight:400;font-size:.8rem;color:var(--muted)}
.mnav{display:flex;align-items:center;gap:6px}
.mnav input[type=month]{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.ib{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:1.1rem}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 20px;padding-bottom:0;border-bottom:3px solid var(--tc,var(--line))}
.tabs button{white-space:nowrap;border:1px solid var(--line);border-bottom:0;background:var(--paper);padding:8px 16px;border-radius:12px 12px 0 0;font-family:var(--hand);font-size:1.05rem;color:var(--ink)}
.tabs button.on{background:var(--c);color:#1d2433;font-weight:700;border-color:var(--c)}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.sm{padding:3px 10px;font-size:.82rem;border-radius:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}
.muted{color:var(--muted)}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:12px}
.banner{background:var(--c);color:var(--on,#fff);text-align:center;padding:12px 16px;border-radius:12px;font-family:var(--hand);font-size:1.7rem;font-weight:700;border:2px solid color-mix(in srgb,var(--c) 60%,#000);margin-bottom:16px}
.banner span{text-decoration:underline;text-underline-offset:6px}
.banner.ar{text-align:center}
.sub{color:var(--muted);margin:0 0 14px}

/* chips, links */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:1.5px solid var(--c,var(--strong));background:var(--paper);border-radius:99px;padding:3px 13px;font-size:.85rem}
.chipb.on{background:var(--c,var(--accent));color:#fff;border-color:var(--c,var(--accent))}
.lk{display:inline-block;font-size:.76rem;border:1px solid var(--c,var(--accent));color:var(--c,var(--accent));border-radius:99px;padding:0 9px;text-decoration:none;margin:2px 4px 0 0;background:var(--paper)}
.lk::before{content:"↗ "}
.lk:hover{background:var(--c,var(--accent));color:#fff}
.tag{display:inline-block;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:600;border:1.5px solid var(--c,var(--muted));color:var(--c,var(--muted));white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}

/* dashboard */
.dtop{display:grid;grid-template-columns:250px minmax(0,1fr) 260px;gap:16px}
@media(max-width:980px){.dtop{grid-template-columns:1fr}}
.namebox{background:#b6d7a8;color:#274e13;border:2px solid #8bb274;border-radius:12px;padding:18px 12px;text-align:center;font-family:var(--hand);font-size:1.7rem;font-weight:700;text-decoration:underline;text-underline-offset:6px}
.datebox{margin-top:12px;background:color-mix(in srgb,var(--accent) 10%,var(--paper));border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-family:var(--hand);font-size:1.2rem;font-weight:700;color:var(--accent);text-decoration:underline}
.setbox{margin-top:12px;border:2px solid #e69138;border-radius:12px;overflow:hidden;background:var(--paper)}
.setbox .sbh{background:#ff9900;color:#fff;text-align:center;font-weight:700;font-size:.85rem;padding:6px}
.setbox .sr span{background:var(--l);color:#1d2433;font-family:var(--hand);font-weight:700;padding:5px 10px;font-size:.95rem}
.setbox input,.setbox select,.setbox .sr div{border:0;background:var(--v);color:#1d2433;padding:6px 10px;width:100%;font-family:var(--hand);font-weight:700;text-align:center}
.setbox .sr:nth-child(2){--l:#d9ead3;--v:#b6d7a8}
.setbox .sr:nth-child(3){--l:#cfe2f3;--v:#9fc5e8}
.setbox .sr:nth-child(4){--l:#ead1dc;--v:#d5a6bd}
.setbox .sr:nth-child(5){--l:#fff2cc;--v:#ffd966}
.setbox .sr{display:grid;grid-template-columns:90px 1fr;border-top:1px solid var(--line);align-items:center}
.chartbox{background:var(--panel);border:2px solid var(--strong);border-radius:12px;padding:12px}
.donbox{background:#ffe599;border:2px solid #e0b93c;border-radius:12px;padding:12px;color:#1d2433}
.donbox .dl{display:flex;justify-content:space-between;font-family:var(--hand);font-weight:700;border-bottom:1px solid #d6b84f;padding:3px 6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);background:var(--paper);border-radius:14px;margin:16px 0}
.stat{padding:10px 14px;border-right:1px solid var(--line)}.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--hand);font-size:1.9rem;line-height:1.2}
.stat span{color:var(--muted);font-size:.85rem}
.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
@media(max-width:860px){.grid2{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow div{text-align:center;font-size:.75rem;color:var(--muted);padding-bottom:4px}
.day{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0;overflow:hidden;text-align:left}
.day .fill{position:absolute;left:0;right:0;bottom:0;background:#6aa84f;opacity:.45;height:var(--p,0%)}
.day .n{position:absolute;top:4px;left:6px;font-weight:600;font-size:.85rem;font-family:var(--hand)}
.day .c{position:absolute;bottom:3px;right:5px;font-size:.68rem;color:var(--muted)}
.day.today{outline:3px solid #ff9900;outline-offset:-1px}
.day.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.day.blank{border:0;pointer-events:none;background:transparent}
.tasks{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);display:grid;gap:6px}
.task{display:flex;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;border:1px solid var(--line);width:100%;text-align:left}
.task .bx{width:20px;height:20px;border:2px solid var(--c);border-radius:6px;display:grid;place-items:center;color:#fff;font-size:.8rem;flex:none}
.task.done .bx{background:var(--c)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.t{font-family:var(--hand);font-weight:700;color:var(--c)}
.chart{width:100%;height:auto}
.chart .gl{stroke:var(--strong);stroke-width:.6;opacity:.6}
.chart .gt,.chart .dl2{fill:var(--muted);font-size:10px}
.donut{width:160px;height:160px;flex:none}
.cards4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:18px}
.mini-card{text-align:left;border:2px solid var(--c);border-radius:14px;padding:14px;width:100%}
.mini-card b{font-family:var(--hand);font-size:1.9rem;display:block;line-height:1.1}
.mini-card span{color:var(--muted);font-size:.85rem}

/* sheet-style tables */
.sheet{overflow:auto;border:2px solid var(--strong);border-radius:12px;background:var(--paper)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{padding:7px 9px;border-bottom:1px dotted var(--strong);border-right:1px solid var(--line);font-size:.88rem;text-align:left;vertical-align:middle}
thead th{position:sticky;top:0;z-index:2;font-family:var(--hand);background:#d0e0e3;color:#1d2433;border-bottom:2px solid var(--strong)}
.stick{position:sticky;left:0;z-index:1;min-width:190px;background:var(--paper)}
thead .stick{z-index:3}
.corner{background:linear-gradient(135deg,#d0e0e3,#b4ccd2)!important;color:#1d2433;font-family:var(--hand);font-size:1.25rem;text-align:left;vertical-align:middle;padding:8px 14px;border-bottom:2px solid var(--strong)!important;min-width:190px}
.corner span{border-bottom:3px solid #ff9900;padding-bottom:1px}
.goalh{background:#c3d8dc!important;color:#cc0000;font-family:var(--hand);font-size:1rem;font-weight:700;text-align:center;vertical-align:middle;min-width:48px;border-bottom:2px solid var(--strong)!important}
.wh{text-align:center;background:var(--wc,#d0e0e3)!important;font-size:1rem;border-left:3px solid var(--strong)}
.dh{text-align:center;padding:3px 2px;min-width:30px;line-height:1.15}
.dh b{display:block;font-size:.9rem;color:#1d2433}.dh span{font-size:.72rem;color:#cc0000;font-family:var(--hand);font-weight:700}
.dh.today{background:#ffd966!important}
.wk{border-left:3px solid var(--strong)}
tr.cat td{background:var(--c);color:var(--on,#fff);font-family:var(--hand);font-weight:700;font-size:1.05rem;border-bottom:2px solid var(--strong)}
tr.hrow>*{background:color-mix(in srgb,var(--c) 14%,var(--paper))}
tr.hrow .stick{background:color-mix(in srgb,var(--c) 14%,var(--paper))}
.cell{width:24px;height:24px;border-radius:7px;border:2px solid transparent;background:transparent;padding:0;display:block;margin:auto;position:relative}
.cell.p{border-color:var(--c)}
.cell.x{border-color:var(--c);background:var(--c)}
.cell.x::after{content:"✓";color:#fff;font-size:.85rem;position:absolute;inset:0;display:grid;place-items:center}
.cell.n:hover{border:2px dashed var(--strong)}
.big .cell{width:34px;height:34px;border-radius:9px}
.big td.ce{padding:8px 4px}
td.ce{padding:4px 2px;text-align:center}
.hn{font-family:var(--hand);font-weight:700;font-size:1.05rem;line-height:1.25;color:var(--c)}
.hn small{display:block;font-family:var(--fbody,"IBM Plex Sans");color:var(--muted);font-weight:400;font-size:.72rem}
tfoot td,tfoot th{background:#efefef;color:#1d2433;font-weight:600;text-align:center;font-size:.78rem;font-family:var(--hand)}
tfoot th{text-align:left}
.seg{display:inline-flex;border:2px solid var(--strong);border-radius:99px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:6px 16px;font-family:var(--hand);font-size:1rem}
.seg button.on{background:#ff9900;color:#fff;font-weight:700}
.hint{font-size:.85rem;color:var(--muted);margin:8px 0 12px}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:26px;height:26px;border-radius:50%;border:1px solid var(--strong);background:var(--paper);padding:0}
.in{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:5px 8px;width:100%}
.in.sm{width:70px}
tr.now th{background:#ffd966;color:#1d2433}
.ck{width:24px;height:24px;border:2px solid var(--c);border-radius:7px;background:transparent;display:grid;place-items:center;color:#fff;padding:0;font-size:.85rem;flex:none}
.ck.on{background:var(--c)}

/* roadmap */
.phases{display:grid;gap:110px}
.phase{border:2px solid var(--c);border-radius:14px;overflow:hidden}
.phase>header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:var(--c);color:var(--on,#fff)}
.phase h3{font-size:1.5rem;text-decoration:underline;text-underline-offset:5px}
.phase .btn{background:rgba(255,255,255,.9);color:#1d2433;border:0}
.phase .body{background:color-mix(in srgb,var(--c) 14%,var(--paper))}
.ri{display:flex;flex-wrap:wrap;align-items:center;gap:12px 30px;padding:14px 16px;border-bottom:1px dotted var(--strong)}
.ri>.ck{flex:none}
.ri .rn{flex:1 1 190px;min-width:150px}
.ri .rl{flex:0 1 230px;min-width:130px}
.ri>.tag{flex:none;min-width:150px;text-align:center;padding:2px 12px}
.ri .nums{flex:none}
.ri .mini{flex:1 1 120px;min-width:100px}
.ri .pc{flex:none;width:46px;text-align:right}
.ri>.row{flex:none;margin-left:auto}
.ri .rn small{color:color-mix(in srgb,var(--c) 72%,var(--ink))}
.ri .nums{color:var(--c);font-weight:700}
.ri .nums input{color:var(--c);font-weight:700;border:1.5px solid color-mix(in srgb,var(--c) 60%,var(--paper))}
.ri .nums input:disabled{opacity:.85;-webkit-text-fill-color:var(--c)}
.ri .pc{color:var(--c);font-size:1.1rem}
.ri>.row .btn{color:var(--c);border-color:color-mix(in srgb,var(--c) 55%,var(--paper));font-weight:600}
.ri .rl .add{color:var(--c)}
.ri:last-child{border-bottom:0}

.rl{display:flex;flex-wrap:wrap;gap:2px 0;align-items:center;min-height:28px;padding:2px 6px;border:1px dashed color-mix(in srgb,var(--c) 55%,transparent);border-radius:10px;background:color-mix(in srgb,var(--c) 6%,var(--paper))}
.rl .lk{margin:1px 4px 1px 0}
.rl .add{border:0;background:transparent;color:var(--muted);font-size:.8rem;padding:0 4px}
.rl .add:hover{color:var(--c)}
.rn b{font-family:var(--hand);font-size:1.1rem;color:var(--c)}
.rn small{display:block;color:var(--muted)}
.nums{display:flex;gap:4px;align-items:center}.nums input{width:56px;padding:4px 6px}
.mini{height:8px;border-radius:99px;background:color-mix(in srgb,var(--strong) 30%,var(--paper));overflow:hidden;min-width:70px}
.mini i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}

/* quran */
.surah{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 18px;border-bottom:1px dotted var(--strong);background:color-mix(in srgb,#ffd966 18%,var(--paper))}
.surah>b{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--strong) 25%,var(--paper));font-size:.95rem}
.surah .cnt{flex:none;width:76px;text-align:center;font-size:.9rem}
.surah .mini{flex:1 1 110px;min-width:90px;height:10px;--c:#2e8b57}
.surah.full{background:color-mix(in srgb,#6aa84f 22%,var(--paper))}

.surah .nm{flex:1 1 130px;min-width:110px;font-size:1.4rem;font-family:var(--far,"Noto Naskh Arabic",serif);direction:rtl;text-align:right;font-weight:700}
.qa{display:flex;flex:none;gap:8px;align-items:center;flex-wrap:nowrap}.qa input{width:66px;text-align:center}.qa .btn{white-space:nowrap}
.qa [data-act=qfull]{background:#2e8b57;color:#fff;border-color:#2e8b57}
.surah:last-child{border-bottom:0}

/* gym */
.gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:26px}
.sess{border:2px solid var(--c);border-radius:12px;overflow:hidden;text-align:left;width:100%;display:block;padding:0;background:var(--panel);background:color-mix(in srgb,var(--c) 24%,var(--paper))}
.sess.sel{box-shadow:0 0 0 4px var(--accent)}
.sesswrap{position:relative}
.sesswrap .tools{position:absolute;top:7px;right:8px;display:flex;gap:6px}
.sesswrap .tools button{width:30px;height:28px;border-radius:8px;border:1px solid rgba(0,0,0,.3);background:rgba(255,255,255,.88);color:#1d2433;padding:0;font-size:1rem}
.sesswrap .tools button:hover{background:#fff;border-color:#000}
.grow{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;margin-bottom:6px}
.grow b{font-family:var(--hand);color:var(--c);font-size:1.05rem}
.sess h3{display:flex;justify-content:space-between;align-items:center;font-size:1.25rem;padding:8px 12px;background:var(--c);color:#1d2433;text-decoration:underline}
.sess .sb{padding:12px 16px 16px}
.sess ul{list-style:none;margin:10px 0 0;padding:0}
.sess li{font-family:var(--hand);font-weight:700;font-size:1.02rem;color:var(--c);text-decoration:underline;margin-bottom:7px;line-height:1.45}
.gblock{border:2px solid var(--c);border-radius:12px;margin-bottom:38px;overflow:hidden;background:var(--panel);background:color-mix(in srgb,var(--c) 13%,var(--paper))}
.gblock>header{padding:12px 18px;display:flex;gap:10px;align-items:center;background:#fce5cd;background:color-mix(in srgb,var(--c) 30%,var(--paper));color:#1d2433;border-bottom:2px solid var(--c)}
.gblock>header b{font-family:var(--hand);font-size:1.3rem;color:var(--c);text-decoration:underline}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px;padding:20px}
.exc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.exc .exi{aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:color-mix(in srgb,var(--c) 10%,var(--paper));display:grid;place-items:center}
.exc .exi img{width:100%;height:100%;object-fit:cover}
.exc .exi svg{width:100%;height:100%;padding:6px}
.exc .exn{font-family:var(--hand);font-size:1.05rem;color:var(--c)}
.exc .kgrow{display:grid;grid-template-columns:70px 1fr;gap:6px}

/* azkar */
.az{display:block;width:100%;text-align:right;background:color-mix(in srgb,var(--c) 12%,var(--paper));border:2px solid var(--c);border-radius:12px;padding:10px 14px;margin-bottom:10px;position:relative;overflow:hidden}
.az .pf{position:absolute;left:0;top:0;bottom:0;background:var(--c);opacity:.2;width:var(--p,0%)}
.az .ar{position:relative;font-size:1.25rem;font-weight:700;color:var(--c);text-decoration:underline;text-underline-offset:5px}
.az .meta{position:relative;display:flex;justify-content:space-between;align-items:center;direction:ltr;font-size:.85rem;color:var(--muted)}
.az.full{opacity:.6}
.azwrap{background:#ffe599;border:2px solid #e0b93c;border-radius:12px;padding:14px;color:#1d2433}
:root[data-theme="dark"] .azwrap,:root:not([data-theme="light"]) .azwrap{--x:0}

/* links / notes */
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;align-items:start}

<script>
/* Each copy of the site (each repo/folder name) gets its own storage and its own cloud gist automatically. */
const PFX='modather-hub';
/* ============ constants & helpers ============ */
const KEY=PFX+'-v1';
const WDN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

const pad=n=>String(n).padStart(2,'0');
const dim=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const dowOf=(ym,d)=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,d).getDay()};
const ymNow=()=>{const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)};
const dkey=()=>{const n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())};
const monthName=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})};
const pct=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;

/* links: "Label | https://..." one per line */
function parseLinks(t){return String(t||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
  l=l.replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g,'');const i=l.indexOf('|');let lab='',u=i>=0?l.slice(i+1).trim():l;if(i>=0)lab=l.slice(0,i).trim();
  if(!/^https?:\/\//i.test(u)&&/\.[a-z]{2,}/i.test(u))u='https://'+u;

  if(!lab){try{lab=new URL(u).hostname.replace(/^www\./,'')}catch(e){lab=u}}
  return{l:lab,u};
}).filter(Boolean)}

const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function deriveKey(user,pass,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(user.trim().toLowerCase()+':'+pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:150000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encPack(key,obj){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({enc:1,iv:b64(iv),ct:b64(new Uint8Array(ct))});
}
async function decPack(key,raw){
  const j=JSON.parse(raw);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(j.iv)},key,unb64(j.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

  if(f.t==='multi')return `<fieldset><legend>${esc(f.l)}</legend><div class="chips">${f.o.map(([val,lab])=>`<label class="chip"><input type="checkbox" name="${f.k}" value="${esc(JSON.stringify(val))}" ${(v||[]).includes(val)?'checked':''}> ${esc(lab)}</label>`).join('')}</div></fieldset>`;
  if(f.t==='select')return `<label>${esc(f.l)}<select name="${f.k}">${f.o.map(([val,lab])=>`<option value="${esc(val)}" ${val===v?'selected':''}>${esc(lab)}</option>`).join('')}</select></label>`;
  if(f.t==='textarea')return `<label>${esc(f.l)}<textarea name="${f.k}" ${f.dir?`dir="${f.dir}"`:''} ${f.ph?`placeholder="${esc(f.ph)}"`:''}>${esc(v)}</textarea></label>`;
  if(f.t==='file')return `<label>${esc(f.l)}<input type="file" name="${f.k}" accept="image/*"></label>`;
  return `<label>${esc(f.l)}<input type="${f.t||'text'}" name="${f.k}" value="${esc(v)}" ${f.t==='number'?'step="any"':''}></label>`;
}
function readF(f,form){
  const els=form.querySelectorAll(`[name="${f.k}"]`);
  if(f.t==='check')return els[0].checked;
  if(f.t==='file')return els[0].files[0]||null;
  if(f.t==='multi')return[...els].filter(e=>e.checked).map(e=>JSON.parse(e.value));
  if(f.t==='number')return els[0].value===''?0:Number(els[0].value);
  return els[0].value;
}
function openForm(o){

  $('#fx').onclick=()=>d.close();

  $('#frm').onsubmit=e=>{e.preventDefault();const v={};F.forEach(f=>{if(f.t!=='html')v[f.k]=readF(f,e.target)});d.close();o.save(v)};

}

function shrinkImg(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{
      const max=420,k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',.78));
    };im.src=fr.result};
    fr.readAsDataURL(file);
  });
}

function areaChart(st,tIdx){

  const pts=st.pl.map((p,i)=>[pd+i*step,Hh-(p?st.dn[i]/p:0)*(Hh-12)]);
  let s=`<svg viewBox="0 0 ${W} ${Hh+22}" class="chart" role="img" aria-label="Daily completion percentage">`;
  [0,25,50,75,100].forEach(v=>{const y=Hh-v/100*(Hh-12);s+=`<line x1="${pd}" x2="${W}" y1="${y}" y2="${y}" class="gl"/><text x="0" y="${y+3}" class="gt">${v}%</text>`});
  s+=`<path d="M${pts[0][0]} ${Hh} ${pts.map(p=>`L${p[0]} ${p[1]}`).join(' ')} L${pts[pts.length-1][0]} ${Hh} Z" fill="#4a86e8" opacity=".35"/>`;
  s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#4a86e8" stroke-width="2"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===tIdx?5:3}" fill="${i===tIdx?'#ff9900':'#4a86e8'}"><title>Day ${i+1}: ${st.dn[i]}/${st.pl[i]}</title></circle>`;if(i%2===0)s+=`<text x="${p[0]}" y="${Hh+15}" text-anchor="middle" class="dl2">${i+1}</text>`});
  return s+'</svg>';
}
function donut(p,c1,c2){

  const path=()=>{x.beginPath();if(full||ic.shape==='square')x.rect(0,0,n,n);else if(ic.shape==='circle')x.arc(n/2,n/2,n/2,0,7);else{const r=n*(ic.shape==='squircle'?.38:.2);x.moveTo(r,0);x.arcTo(n,0,n,n,r);x.arcTo(n,n,0,n,r);x.arcTo(0,n,0,0,r);x.arcTo(0,0,n,0,r);x.closePath()}};
  const im=ic.img?getIconImg(ic.img):null;
  if(im&&im.complete&&im.naturalWidth){path();x.save();x.clip();x.drawImage(im,0,0,n,n);x.restore();return c.toDataURL('image/png')}
  x.fillStyle=ic.bg;path();x.fill();
  const t=Array.from(ic.text||'M').slice(0,2).join('');
  const k=(full||ic.shape==='circle')?.5:.58;
  x.fillStyle=ic.fg;x.textAlign='center';x.textBaseline='middle';
  x.font='700 '+Math.round(n*k*(t.length>1?.78:1))+'px system-ui,"Segoe UI",Arial,sans-serif';
  x.fillText(t,n/2,n/2+n*.03);
  return c.toDataURL('image/png')}

async function iconCache(ic){
  if(!('caches' in window))return;

    if(!ic){await caches.delete('modather-icons');return}
    const c=await caches.open('modather-icons');
    const put=async(fn,url)=>{const b=await (await fetch(url)).blob();await c.put(new URL(fn,location.href).href,new Response(b,{headers:{'Content-Type':'image/png'}}))};
    await Promise.all([put('icon-192.png',drawIcon(192,ic)),put('icon-512.png',drawIcon(512,ic)),put('icon-maskable-512.png',drawIcon(512,ic,true)),put('apple-touch-icon.png',drawIcon(180,ic,true)),put('favicon-64.png',drawIcon(64,ic))]);

  }catch(e){}
}

function tileUrl(pat,hex,alpha){
  const rgb=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16)).join(',');
  const[w,h,svg,vb]=TILES[pat](`rgba(${rgb},${alpha})`);
  const doc=`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'${vb?` viewBox='${vb}' preserveAspectRatio='none'`:''}>${svg}</svg>`;
  return{url:`url("data:image/svg+xml,${encodeURIComponent(doc)}")`,w,h};
}
function applyBgCfg(c,img){
  const b=document.body.style;
  b.backgroundAttachment='scroll';b.backgroundPosition='0 0';b.backgroundRepeat='repeat';
  if(c.type==='none'){b.backgroundImage='none';b.setProperty('--tint',c.color||'#ffffff');b.setProperty('--tintp','45%');return}
  if(c.type==='image'){
    if(!img){b.backgroundImage='none';return}
    const ov=Math.max(0,Math.min(95,c.ov==null?60:c.ov));
    b.backgroundImage=`linear-gradient(color-mix(in srgb,var(--bg) ${ov}%,transparent),color-mix(in srgb,var(--bg) ${ov}%,transparent)),url("${img}")`;
    b.backgroundSize='cover';b.backgroundPosition='center';b.backgroundRepeat='no-repeat';b.backgroundAttachment='fixed';
    b.setProperty('--tint',c.color||'#ffffff');b.setProperty('--tintp','0%');return;
  }
  const t=tileUrl(c.pat||'plus',c.color||'#475569',c.alpha==null?.22:c.alpha);
  b.backgroundImage=t.url;b.backgroundSize=`${t.w}px ${t.h}px`;
  b.setProperty('--tint',c.color||'#ffffff');b.setProperty('--tintp','7%');
}
function applyBg(key){
  const c=bgCfg(key);

  applyBgCfg(c,c.type==='image'?(S.bgimgs||{})[c.imgId]:'');
}
function applyBgDefault(key){
  const[tile,col,tint]=PAGEBG[key]||PAGEBG.dash;
  const mono=key==='gym';                       /* Gym page: black and white */
  const base=mono?(isDark()?'#ffffff':'#000000'):col;
  const rgb=[1,3,5].map(i=>parseInt(base.slice(i,i+2),16)).join(',');
  const c=`rgba(${rgb},${mono?.2:(isDark()?.2:.22)})`;
  const[w,h,svg,vb]=TILES[tile](c);
  const doc=`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'${vb?` viewBox='${vb}' preserveAspectRatio='none'`:''}>${svg}</svg>`;
  document.body.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(doc)}")`;
  document.body.style.backgroundSize=`${w}px ${h}px`;
  document.body.style.setProperty('--tint',mono?(isDark()?'#000000':'#ffffff'):tint);
  document.body.style.setProperty('--tintp',mono?'100%':'7%');
}

  l.href='https://fonts.googleapis.com/css2?family='+encodeURIComponent(name).replace(/%20/g,'+')+(w?':wght@'+w:'')+'&display=swap';

async function shrinkBgImg(file){
  const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>res(fr.result);fr.readAsDataURL(file)});
  const im=await new Promise((res,rej)=>{const i=new Image();i.onerror=rej;i.onload=()=>res(i);i.src=url});
  for(const[max,q]of[[1100,.7],[900,.64],[720,.58],[560,.5]]){
    const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    const d=c.toDataURL('image/jpeg',q);if(d.length<220000)return d;
  }
  throw new Error('picture too big');
}

    const href=/^www\./i.test(u)?'https://'+u:u;
    let label=u;try{const U=new URL(href);label=U.hostname.replace(/^www\./,'')+(U.pathname.length>1?U.pathname.slice(0,18)+(U.pathname.length>18?'\u2026':''):'')}catch(e){}
    out.push(`<a class="nlink" href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>${esc(tail)}`);
    last=m.index+m[0].length;

async function shrinkNoteImg(file){
  const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>res(fr.result);fr.readAsDataURL(file)});
  const im=await new Promise((res,rej)=>{const i=new Image();i.onerror=rej;i.onload=()=>res(i);i.src=url});
  for(const[max,q]of[[900,.78],[720,.72],[560,.66],[420,.6]]){
    const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    const d=c.toDataURL('image/jpeg',q);if(d.length<200000)return d;
  }
  throw new Error('image too big');
}
function noteEditor(id){
  const isNew=!id,n=isNew?null:S.notes.find(x=>x.id===id);
  const draft=isNew?{title:'',body:'',images:[]}:{title:n.title,body:n.body,images:(n.images||[]).map(im=>({...im}))};
  const d=$('#dlg');
  const pull=()=>{const f=$('#frm');if(!f)return;draft.title=f.elements.title.value;draft.body=f.elements.body.value;d.querySelectorAll('[data-cap]').forEach(el=>{const im=draft.images[+el.dataset.cap];if(im)im.c=el.value})};
  const close=()=>{d.onclick=null;d.close()};
  const draw=()=>{
    d.innerHTML=`<form id="frm"><h3>${isNew?'New note':'Edit note'}</h3>
    <label>Title<input name="title" value="${esc(draft.title)}"></label>
    <label>Note<textarea name="body" style="min-height:130px" placeholder="Write here. Any link you paste becomes tappable.">${esc(draft.body)}</textarea></label>
    <h4 class="hand" style="margin:16px 0 6px;font-size:1.2rem">Images</h4>
    <div>${draft.images.map((im,i)=>`<div class="nrow"><img src="${im.d}" alt=""><textarea data-cap="${i}" placeholder="Comment on this image" aria-label="Comment on image ${i+1}">${esc(im.c)}</textarea><button type="button" class="btn sm" data-g="rmimg" data-i="${i}" aria-label="Remove image ${i+1}">\u2715</button></div>`).join('')||'<div class="empty">No images yet.</div>'}</div>
    <div class="row" style="margin-top:8px"><button type="button" class="btn" data-g="addimg">+ Add images</button><input type="file" id="nfile" accept="image/*" multiple hidden></div>
    <div class="dact">${isNew?'':'<button type="button" class="btn danger" data-g="del">Delete</button>'}<span class="sp"></span><button type="button" class="btn" data-g="cancel">Cancel</button><button type="button" class="btn primary" data-g="save">Save</button></div></form>`;
    $('#nfile').onchange=async e=>{
      const files=[...e.target.files];if(!files.length)return;
      pull();toast('Adding '+files.length+' image'+(files.length>1?'s':'')+'\u2026');
      for(const f of files){try{draft.images.push({id:uid(),c:'',d:await shrinkNoteImg(f)})}catch(x){toast('One of the images could not be used.')}}
      draw();
    };
    $('#frm').onsubmit=e=>{
      e.preventDefault();pull();
      if(!draft.title.trim()&&!draft.body.trim()&&!draft.images.length){close();return}
      if(isNew)S.notes.unshift({id:uid(),title:draft.title,body:draft.body,images:draft.images});
      else{n.title=draft.title;n.body=draft.body;n.images=draft.images}
      close();done();
    };
  };
  d.onclick=e=>{
    const b=e.target.closest('[data-g]');if(!b||!d.contains(b))return;
    pull();const a=b.dataset.g;
    if(a==='cancel'){close();return}
    if(a==='save'){$('#frm').requestSubmit();return}
    if(a==='addimg'){$('#nfile').click();return}
    if(a==='rmimg'){draft.images.splice(+b.dataset.i,1)}
    else if(a==='del'){close();confirmBox('Delete this note and its images?',()=>{S.notes=S.notes.filter(x=>x!==n);done()},'Delete');return}
    draw();
  };
  draw();d.showModal();
}

  biooff:()=>{localStorage.removeItem(BIOK);try{indexedDB.deleteDatabase(PFX+'-bio')}catch(e){}toast('Fingerprint unlock removed from this device.');render()},
  seclock:async()=>{await flush();lockNow()},
  notea:()=>noteEditor(null),notee:a=>noteEditor(a.dataset.id),
  bg:a=>bgEditor(a.dataset.k||(tab==='space'?spaceFrom:tab)),
  fontsreset:()=>{S.fonts={};done()},
  bgresetall:()=>confirmBox('Put every page back to its default background?',()=>{S.bgs={};S.bgimgs={};done()},'Reset'),
  nview:a=>{const n=S.notes.find(x=>x.id===a.dataset.n),im=n&&(n.images||[])[+a.dataset.i];if(!im||!im.d)return;const d=$('#dlg');d.innerHTML=`<h3>${esc(n.title||'Image')}</h3><img class="lbimg" src="${im.d}" alt=""><div class="note" style="margin-top:10px">${linkify(im.c)}</div><div class="dact"><span class="sp"></span><button type="button" class="btn primary" data-g="x">Close</button></div>`;d.onclick=e=>{if(e.target.closest('[data-g]')){d.onclick=null;d.close()}};d.showModal()},
  copyexp:()=>{const t=$('#exp');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}$('#cpmsg').textContent=ok?'Copied.':'Select the text and copy it manually.'},
  doimp:()=>{try{const j=JSON.parse($('#imp').value);if(!j||!j.months||!j.cats)throw 0;confirmBox('Replace all current data with this backup?',()=>{
    try{
      S=migrate(j);if(!S.ym)S.ym=ymNow();
      try{for(const id of secIds()){meta.t[id]=tick();meta.dirty[id]=1}saveMeta()}catch(e){}
      done();
      setTimeout(async()=>{
        try{await flush()}catch(e){}
        let ok=false;try{const raw=localStorage.getItem(KEY)||'';ok=raw.length>20&&(cryptoKey||JSON.parse(raw).name===S.name)}catch(e){}
        toast(ok?'Backup imported and saved on this device.':'Backup imported, but this browser is NOT saving it. Open the app from your website (not a preview inside another app) and import again.')
      },700)
    }catch(err){toast('Import failed: '+(err&&err.message||err))}
  },'Import')}catch(e){toast('That does not look like a valid backup.')}},
  reset:()=>confirmBox('Erase all your edits and restore the sheet defaults? If cloud sync is on, this also resets your cloud copy and your other devices.',()=>{S=seed();tab='dash';selDay=13;done()},'Reset')
};
const G={
  iconimg:a=>{const f=a.files&&a.files[0];a.value='';if(!f)return;
    const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
      const n=256,c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d');
      const m=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-m)/2,sy=(im.naturalHeight-m)/2;
      x.drawImage(im,sx,sy,m,m,0,0,n,n);
      S.icon=Object.assign({},iconCfg(),{img:c.toDataURL('image/png')});done()};
      im.onerror=()=>toast('Could not read this picture. Try a PNG or JPG.');im.src=fr.result};
    fr.readAsDataURL(f)},
  icontext:a=>{S.icon=Object.assign({},iconCfg(),{text:Array.from(a.value.trim()||'M').slice(0,2).join('')});done()},
  iconbg:a=>{S.icon=Object.assign({},iconCfg(),{bg:a.value});done()},
  iconfg:a=>{S.icon=Object.assign({},iconCfg(),{fg:a.value});done()},
  iconshape:a=>{S.icon=Object.assign({},iconCfg(),{shape:a.value});done()},
  utotal:a=>{S.uni.find(x=>x.id===a.dataset.id).total=Math.max(1,Math.round(+a.value||30));done()},
  uprog:a=>{S.uni.find(x=>x.id===a.dataset.id).prog=Math.max(0,Math.min(100,+a.value||0));done()},
  rdone:a=>{findR(a.dataset.id).r.done=Math.max(0,+a.value||0);done()},
  rsum:a=>{findR(a.dataset.id).r.sum=Math.max(0,+a.value||0);done()},
  qset:a=>{const i=a.dataset.i,v=Math.max(0,Math.min(AYAH[i-1],Math.round(+a.value||0)));if(v)S.quran[i]=v;else delete S.quran[i];done()},
  qsearch:a=>{qSearch=a.value.trim();render()},
  exkg:a=>{S.gym.lib[a.dataset.g].find(x=>x.id===a.dataset.e).kg=a.value;save()},
  exnote:a=>{S.gym.lib[a.dataset.g].find(x=>x.id===a.dataset.e).note=a.value;save()},
  gdate:a=>{S.gym.sessions.find(x=>x.id===a.dataset.s).date=a.value;done()},
  name:a=>{S.name=a.value.trim()||'Modather';done()},
  theme:a=>{S.theme=a.value;done()},
  autoplan:a=>{S.autoPlan=a.value==='1';done()},
  fontset:a=>{S.fonts=S.fonts||{};S.fonts[a.dataset.k]=a.value;done()},
  cyear:a=>{const y=Math.max(2000,Math.min(2100,Math.round(+a.value||2026)));requestMonth(y+'-'+S.ym.slice(5))},
  cmonth:a=>requestMonth(S.ym.slice(0,4)+'-'+pad(+a.value)),
  stype:a=>{spaceObj().items.find(x=>x.id===a.dataset.id).t=a.value;done()},
  stitle:a=>{spaceObj().items.find(x=>x.id===a.dataset.id).title=a.value;save()},
  surl:a=>{const L=parseLinks(a.value);spaceObj().items.find(x=>x.id===a.dataset.id).url=L.length?L[0].u:'';done()},
  secidle:a=>{const au=getAuth();if(au){au.idle=+a.value;localStorage.setItem(AUTH,JSON.stringify(au));setupIdle();toast(au.idle?`Auto-lock after ${au.idle} minutes.`:'Auto-lock is off.')}}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])A[a.dataset.act](a,e)});
document.addEventListener('change',e=>{const a=e.target.closest('[data-chg]');if(a&&G[a.dataset.chg])G[a.dataset.chg](a)});

$('#dlg').addEventListener('close',()=>{if(S&&!$('#app').hidden)render()});
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{if(cryptoKey)setupIdle()},{passive:true}));
window.addEventListener('online',()=>{if(!S)return;if(col){pushSoon();reconcile().catch(()=>{})}else syncStart()});
window.addEventListener('offline',()=>{if(col)setSync('offline')});
document.addEventListener('visibilitychange',()=>{if(document.hidden||!S)return;if(rolloverCheck())render();if(col){syncScan();pushSoon()}});
setInterval(()=>{if(S&&!document.hidden&&!$('#app').hidden&&rolloverCheck())render()},300000);
window.addEventListener('pagehide',()=>{if(S)syncScan()});
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{if(!isEditing()){pendingRender=false;if(S&&!$('#app').hidden)render()}},60)});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(S&&!$('#app').hidden)render()})}catch(e){}

/* ============ app mode: works offline, keeps data safe, updates itself ============ */
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').then(reg=>{setInterval(()=>reg.update().catch(()=>{}),3600000)}).catch(()=>{});
    navigator.serviceWorker.addEventListener('message',e=>{if(e.data==='updated')toast('A new version is ready. Close and reopen the app to use it.')});
  });
}
window.addEventListener('online',()=>{toast('Back online. Syncing your changes\u2026');try{navigator.serviceWorker.getRegistration().then(r=>r&&r.update().catch(()=>{}))}catch(e){}});
window.addEventListener('offline',()=>toast('You are offline. Everything is saved on this device and will sync when the internet is back.'));
boot();
</script>
</body>
