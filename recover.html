<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover password (admin)</title>
<style>body{font:16px system-ui;max-width:640px;margin:30px auto;padding:0 16px}textarea{width:100%;height:110px;margin:6px 0 14px;font:12px monospace}button{padding:10px 18px;font-size:1rem}#o{margin-top:16px;padding:12px;background:#eef;border-radius:8px;white-space:pre-wrap}</style>
<h2>Recover a user's password</h2><p>Runs only in your browser. Never upload your private key anywhere.</p>
<b>Your private key (owner-private-key.json)</b><textarea id="k"></textarea>
<b>Recovery code from the email</b><textarea id="r"></textarea>
<button id="go">Decrypt</button><div id="o"></div>
<script>const u8=t=>Uint8Array.from(atob(t.trim()),c=>c.charCodeAt(0));
go.onclick=async()=>{try{const k=await crypto.subtle.importKey('jwk',JSON.parse(document.getElementById('k').value),{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);
const d=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'RSA-OAEP'},k,u8(document.getElementById('r').value))));
o.textContent='Username: '+d.u+'\nPassword: '+d.p}catch(e){o.textContent='Could not decrypt. Check the key and the code.'}}</script>
